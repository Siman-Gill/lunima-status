[build]
  publish   = "public"
  functions = "netlify/functions"

# dashboard data
[[redirects]]
  from   = "/api/status"
  to     = "/.netlify/functions/status"
  status = 200

# installer download + agent polling  ← new
[[redirects]]
  from   = "/api/install"
  to     = "/.netlify/functions/install"
  status = 200

# client dashboard
[[redirects]]
  from   = "/s/*"
  to     = "/status.html"
  status = 200

[[redirects]]
  from   = "/setup/:token"
  to     = "/install.html?t=:token"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/signup.html"
  status = 200

[[redirects]]
  from = "/setup/:token"
  to = "/signup.html?t=:token"
  status = 200
