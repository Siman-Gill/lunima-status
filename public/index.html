<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Sign In — Lunima Guard</title>
<style>
  :root{
    --bg:#0a0a0b; --panel:#141416; --card:#1b1b1e; --card-2:#0f2320;
    --line:#2a2a2e; --line-teal:#2a4a44; --teal:#7dd3c0; --teal-ink:#0a0a0b;
    --orange:#e8542f; --text:#ffffff; --muted:#a6a6ac; --muted-2:#7d7d84;
    --red:#e8542f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;
    -webkit-font-smoothing:antialiased;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;
    background:radial-gradient(120% 100% at 50% 0%,#12231f 0%,var(--bg) 55%)}
  .box{width:100%;max-width:400px}

  .logo{font-size:17px;font-weight:600;letter-spacing:1.5px;display:flex;
    align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
  .logo .mark{display:inline-flex;gap:3px}
  .logo .mark span{width:12px;height:12px;border-radius:50%;background:#fff}
  .logo .mark span:last-child{border-radius:3px}

  .eyebrow{display:inline-block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--teal);background:#12231f;padding:6px 14px;border-radius:20px}
  h1{font-size:26px;font-weight:600;letter-spacing:-0.3px;margin:16px 0 8px}
  .sub{font-size:14px;color:var(--muted);line-height:1.7}
  .head{text-align:center;margin-bottom:26px}

  .card{background:var(--card);border-radius:14px;padding:24px;border:1px solid var(--line)}

  label{display:block;font-size:13px;font-weight:500;color:#d0d0d5;margin-bottom:7px}
  input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:13px 14px;font-size:15px;color:var(--text);outline:none;font-family:inherit;
    letter-spacing:1px;transition:border-color .2s}
  input[type=text]:focus{border-color:var(--teal)}
  input[type=text]::placeholder{color:#55555b;letter-spacing:0}

  .remember{display:flex;align-items:center;gap:9px;margin:14px 0 18px;font-size:13px;color:var(--muted)}
  .remember input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer}
  .remember label{margin:0;font-weight:400;color:var(--muted);cursor:pointer}

  .btn{display:block;width:100%;text-align:center;font-size:14px;font-weight:500;
    padding:13px 26px;border-radius:8px;cursor:pointer;border:1px solid transparent;
    font-family:inherit;background:var(--orange);color:#fff;transition:background .2s}
  .btn:hover:not(:disabled){background:#f26a48}
  .btn:disabled{opacity:.55;cursor:default}
  .btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  .msg{font-size:13px;line-height:1.6;padding:12px 14px;border-radius:8px;margin-top:14px;display:none}
  .msg.err{display:block;background:#2a1512;color:#ff9d8a;border:1px solid #4a2019}
  .msg.ok{display:block;background:#12231f;color:var(--teal);border:1px solid var(--line-teal)}

  .foot{text-align:center;margin-top:22px;font-size:13px;color:var(--muted-2);line-height:1.8}
  .foot a{color:var(--teal);text-decoration:none}

  .trust{display:flex;justify-content:center;gap:18px;margin-top:22px;padding-top:18px;
    border-top:1px solid var(--line);flex-wrap:wrap;font-size:12px;color:var(--muted-2)}
  .trust span{display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block}

  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;
    vertical-align:-2px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="page">
  <div class="box">
    <div class="head">
      <div class="logo"><span class="mark"><span></span><span></span></span> LUNIMA</div>
      <span class="eyebrow">Client portal</span>
      <h1>Sign in</h1>
      <p class="sub">Enter the access code from your welcome email to view your live Guard status.</p>
    </div>

    <div class="card">
      <label for="code">Access code</label>
      <input id="code" type="text" placeholder="e.g. 8f3c2a91d47b"
             autocomplete="off" autocapitalize="off" spellcheck="false">

      <div class="remember">
        <input id="remember" type="checkbox" checked>
        <label for="remember">Keep me signed in on this device</label>
      </div>

      <button class="btn" id="go">View my status</button>

      <div class="msg" id="msg"></div>
    </div>

    <p class="foot">
      Lost your access code?<br>
      Call <a href="tel:6475523894">647-552-3894</a> or email <a href="mailto:shield@lunima.ca">shield@lunima.ca</a>
    </p>

    <div class="trust">
      <span><span class="dot"></span> Powered by Huntress</span>
      <span><span class="dot"></span> Canadian-owned</span>
    </div>
  </div>
</div>

<script>
var input = document.getElementById('code');
var btn   = document.getElementById('go');
var msg   = document.getElementById('msg');
var rem   = document.getElementById('remember');

function show(kind, text){
  msg.className = 'msg ' + kind;
  msg.textContent = text;
}

function clean(v){
  return (v || '').trim().replace(/\s+/g, '').replace(/^\/+|\/+$/g, '');
}

function signIn(code){
  code = clean(code);
  if (!code) { show('err', 'Enter your access code to continue.'); input.focus(); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Checking…';
  msg.className = 'msg';

  fetch('/api/status?token=' + encodeURIComponent(code))
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(res){
      if (res.ok && !res.d.error) {
        if (rem.checked) {
          try { localStorage.setItem('lunima_code', code); } catch(e){}
        } else {
          try { localStorage.removeItem('lunima_code'); } catch(e){}
        }
        show('ok', 'Welcome back, ' + res.d.company + '. Opening your dashboard…');
        setTimeout(function(){ location.href = '/s/' + encodeURIComponent(code); }, 600);
        return;
      }

      btn.disabled = false;
      btn.textContent = 'View my status';

      if (res.d.error === 'not_found') {
        show('err', 'That access code was not recognised. Check it against your welcome email, or call 647-552-3894 and we will resend it.');
      } else if (res.d.error === 'huntress_unreachable') {
        show('err', 'We cannot reach the monitoring platform right now. Your protection is unaffected — please try again in a minute.');
      } else {
        show('err', 'Something went wrong. Please try again, or call 647-552-3894.');
      }
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = 'View my status';
      show('err', 'Could not connect. Check your internet connection and try again.');
    });
}

btn.addEventListener('click', function(){ signIn(input.value); });
input.addEventListener('keydown', function(e){ if (e.key === 'Enter') signIn(input.value); });

// Returning client — skip straight through if they ticked "keep me signed in"
(function(){
  var saved;
  try { saved = localStorage.getItem('lunima_code'); } catch(e){}
  if (saved) { location.replace('/s/' + encodeURIComponent(saved)); }
  else { input.focus(); }
})();
</script>
</body>
</html>
